<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>GUIDEON 운영자 초대</title>
</head>
<body style="margin:0; padding:0; background-color:#F8FAFC; font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">

<!-- Outer wrapper -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F8FAFC; padding:40px 20px;">
    <tr>
        <td align="center">

            <!-- Main card -->
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px; background-color:#FFFFFF; border-radius:16px; overflow:hidden; box-shadow:0 4px 24px rgba(0,0,0,0.06);">

                <!-- Header bar -->
                <tr>
                    <td style="background:linear-gradient(135deg,#FF6B52 0%,#FF8A75 100%); padding:32px 40px; text-align:center;">
                        <span style="font-size:28px; font-weight:700; color:#FFFFFF; letter-spacing:-0.5px;">
                            GUIDE<span style="opacity:0.9;">ON</span>
                        </span>
                    </td>
                </tr>

                <!-- Body -->
                <tr>
                    <td style="padding:40px;">

                        <!-- Title -->
                        <p style="margin:0 0 8px; font-size:22px; font-weight:700; color:#1E293B; letter-spacing:-0.3px;">
                            운영자 초대
                        </p>
                        <p style="margin:0 0 28px; font-size:15px; color:#64748B; line-height:1.6;">
                            아래 관광지의 운영자로 초대되었습니다.
                        </p>

                        <!-- Site info box -->
                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#FFF5F3; border-radius:12px; margin-bottom:28px;">
                            <tr>
                                <td style="padding:20px 24px;">
                                    <p style="margin:0 0 4px; font-size:12px; font-weight:600; color:#FF6B52; text-transform:uppercase; letter-spacing:1px;">
                                        관광지
                                    </p>
                                    <p style="margin:0; font-size:18px; font-weight:600; color:#1E293B;" th:text="${siteName}">
                                        관광지명
                                    </p>
                                </td>
                            </tr>
                        </table>

                        <!-- CTA Button -->
                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-bottom:28px;">
                            <tr>
                                <td align="center">
                                    <a th:href="${acceptUrl}"
                                       style="display:inline-block; padding:14px 40px; background:linear-gradient(135deg,#FF6B52 0%,#FF8A75 100%); color:#FFFFFF; font-size:15px; font-weight:600; text-decoration:none; border-radius:12px; letter-spacing:0.2px;">
                                        초대 수락하기
                                    </a>
                                </td>
                            </tr>
                        </table>

                        <!-- Expiry notice -->
                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F1F5F9; border-radius:10px; margin-bottom:8px;">
                            <tr>
                                <td style="padding:14px 20px; text-align:center;">
                                    <p style="margin:0; font-size:13px; color:#64748B;">
                                        이 초대는 <strong style="color:#1E293B;" th:text="${expiresAt}">2026-03-26</strong>까지 유효합니다.
                                    </p>
                                </td>
                            </tr>
                        </table>

                    </td>
                </tr>

                <!-- Footer -->
                <tr>
                    <td style="padding:20px 40px 28px; border-top:1px solid #F1F5F9; text-align:center;">
                        <p style="margin:0 0 4px; font-size:12px; color:#94A3B8;">
                            본 메일은 GUIDEON 관리자에 의해 발송되었습니다.
                        </p>
                        <p style="margin:0; font-size:12px; color:#CBD5E1;">
                            &copy; 2026 GUIDEON. All rights reserved.
                        </p>
                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>
</html>
