server:
  port: 8081

spring:
  application:
    name: guideon-admin-bff

  # Database
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  # Multipart
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  # Mail (SMTP)
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    default-encoding: UTF-8

  # Thymeleaf
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    check-template-location: true

  # JPA
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100

  # Redis
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}

  # Feign
  cloud:
    openfeign:
      okhttp:
        enabled: true
      client:
        config:
          default:
            connect-timeout: 5000
            read-timeout: 10000
          core-chat:
            connect-timeout: 5000
            read-timeout: 90000

# Logging (production default)
logging:
  level:
    org.springframework.web: info

# Application
app:
  init:
    admin-email: ${INIT_ADMIN_EMAIL}
    admin-password: ${INIT_ADMIN_PASSWORD}
  invite:
    expire-days: ${INVITE_EXPIRE_DAYS}
    accept-url: ${INVITE_ACCEPT_URL:http://localhost:3000/invite/accept}
    from-email: ${MAIL_FROM:noreply@guideon.kr}
    from-name: ${MAIL_FROM_NAME:GUIDEON}

# JWT
jwt:
  secret: ${JWT_SECRET}
  access-token-validity-ms: 900000      # 15분
  refresh-token-validity-ms: 2592000000 # 30일

# File Storage
file:
  upload-dir: ${FILE_UPLOAD_DIR:./uploads}
  base-url: ${FILE_BASE_URL:http://localhost:8081}

# Document Scheduler
document:
  timeout-scheduler:
    enabled: false

# Core Service (Internal API)
core:
  service:
    url: ${CORE_SERVICE_URL:http://localhost:8080}

# FastAPI (AI Service — 음성 클로닝)
fastapi:
  service:
    url: ${FASTAPI_SERVICE_URL:http://localhost:8000}
  voice:
    connect-timeout: 10000    # 연결 타임아웃 (ms)
    read-timeout: 120000      # Cartesia 처리 시간 고려

# Tripo AI (3D Model Generation)
tripo:
  api-key: ${TRIPO_API_KEY}
  base-url: https://api.tripo3d.ai/v2/openapi
  connect-timeout: 10000   # 연결 타임아웃 (ms)
  read-timeout: 60000      # 읽기 타임아웃 (ms)
  image-model-version: ${TRIPO_IMAGE_MODEL_VERSION:v3.1-20260211}  # image_to_model 버전 (env로 교체 가능)
  rig-model-version:   ${TRIPO_RIG_MODEL_VERSION:v2.0-20250506}    # animate_rig 엔진 버전
  rig-spec:            ${TRIPO_RIG_SPEC:mixamo}                     # mixamo 호환 본 이름 생성
