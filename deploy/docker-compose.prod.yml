services:
  # ===== Infrastructure =====

  db:
    image: ghcr.io/project-guideon/db:latest
    container_name: guideon-db
    # ports: 내부 전용 — 외부 노출 안 함
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: guideon-redis
    # ports: 내부 전용
    networks:
      - internal
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== Backend (Spring Boot) =====

  core:
    image: ghcr.io/project-guideon/core:latest
    container_name: guideon-core
    # ports: 내부 전용 — BFF에서만 접근
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      FASTAPI_SERVICE_URL: http://fastapi:8000
      JAVA_OPTS: "-Xmx384m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    restart: always

  admin-bff:
    image: ghcr.io/project-guideon/admin-bff:latest
    container_name: guideon-admin-bff
    # ports: nginx가 프록시
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      CORE_SERVICE_URL: http://core:8080
      JWT_SECRET: ${JWT_SECRET}
      INIT_ADMIN_EMAIL: ${INIT_ADMIN_EMAIL}
      INIT_ADMIN_PASSWORD: ${INIT_ADMIN_PASSWORD}
      INVITE_EXPIRE_DAYS: ${INVITE_EXPIRE_DAYS:-7}
      INVITE_ACCEPT_URL: ${INVITE_ACCEPT_URL:-https://guideon-frontend.vercel.app/invite/accept}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM:-noreply@guideon.kr}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-GUIDEON}
      TRIPO_API_KEY: ${TRIPO_API_KEY}
      FILE_BASE_URL: https://${DOMAIN}
      JAVA_OPTS: "-Xmx384m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m"
    volumes:
      - uploads:/app/uploads
    depends_on:
      - core
    networks:
      - internal
    restart: always

  kiosk-bff:
    image: ghcr.io/project-guideon/kiosk-bff:latest
    container_name: guideon-kiosk-bff
    # ports: nginx가 프록시
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      CORE_SERVICE_URL: http://core:8080
      FASTAPI_SERVICE_URL: http://fastapi:8000
      JAVA_OPTS: "-Xmx384m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m"
    depends_on:
      - core
      - fastapi
    networks:
      - internal
    restart: always

  # ===== AI Service (FastAPI) =====

  fastapi:
    image: ghcr.io/project-guideon/fastapi:latest
    container_name: guideon-fastapi
    # ports: 내부 전용 — Kiosk BFF에서만 접근
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GOOGLE_APPLICATION_CREDENTIALS: /app/google_key.json
      GOOGLE_PROJECT_ID: ${GOOGLE_PROJECT_ID}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-guideon_ai}
      RAG_VERSION: ${RAG_VERSION:-v2}
      CORE_BASE_URL: http://core:8080
      ALLOWED_STORAGE_HOSTS: ${DOMAIN}
      LLAMA_CLOUD_API_KEY: ${LLAMA_CLOUD_API_KEY}
    volumes:
      - ./google_key.json:/app/google_key.json:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      core:
        condition: service_started
    networks:
      - internal
    restart: always

  # ===== Reverse Proxy + HTTPS =====

  nginx:
    image: nginx:alpine
    container_name: guideon-nginx
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template
      - /var/www/certbot:/var/www/certbot
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - admin-bff
      - kiosk-bff
    networks:
      - internal
    restart: always

  # Let's Encrypt 인증서 자동 갱신
  certbot:
    image: certbot/certbot
    container_name: guideon-certbot
    volumes:
      - /var/www/certbot:/var/www/certbot
      - /etc/letsencrypt:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - internal

volumes:
  postgres_data:
  uploads:

networks:
  internal:
    driver: bridge
