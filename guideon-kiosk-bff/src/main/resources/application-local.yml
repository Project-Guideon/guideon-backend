# Local Development Profile
# 사용법: --spring.profiles.active=local

spring:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true

fastapi:
  service:
    url: http://127.0.0.1:8000

logging:
  level:
    org.hibernate.SQL: debug
    com.guideon.kiosk: debug