name: Deploy Backend

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Docker image 이름은 무조건 소문자여야 하므로 강제 소문자 변환
  IMAGE_PREFIX: ghcr.io/project-guideon

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - service: core
            dockerfile: guideon-core/Dockerfile
            context: .
          - service: admin-bff
            dockerfile: guideon-admin-bff/Dockerfile
            context: .
          - service: kiosk-bff
            dockerfile: guideon-kiosk-bff/Dockerfile
            context: .
          - service: db
            dockerfile: infra/Dockerfile
            context: infra
          - service: mesh-processor
            dockerfile: mesh-processor/Dockerfile
            context: mesh-processor

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Copy deploy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "deploy/docker-compose.prod.yml,deploy/nginx.conf.template"
          target: "/home/ubuntu/guideon-deploy"
          strip_components: 1

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ~/guideon-deploy
            mv docker-compose.prod.yml docker-compose.yml
            echo "${{ secrets.ENV_FILE_CONTENT }}" > .env
            umask 077
            echo "${{ secrets.GOOGLE_KEY_BASE64 }}" | base64 -d > google_key.json
            docker compose pull
            docker compose up -d
            docker exec guideon-nginx nginx -s reload
            docker image prune -af --filter "until=168h"
            echo "=== Deploy complete ==="
            docker compose ps
