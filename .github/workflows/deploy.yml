name: Deploy Backend

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  # Docker image 이름은 무조건 소문자여야 하므로 강제 소문자 변환
  IMAGE_PREFIX: ghcr.io/project-guideon

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - service: core
            dockerfile: guideon-core/Dockerfile
          - service: admin-bff
            dockerfile: guideon-admin-bff/Dockerfile
          - service: kiosk-bff
            dockerfile: guideon-kiosk-bff/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Copy deploy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "deploy/docker-compose.prod.yml,deploy/nginx.conf"
          target: "/home/ubuntu/guideon-deploy"
          strip_components: 1

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ~/guideon-deploy
            mv docker-compose.prod.yml docker-compose.yml
            echo "${{ secrets.ENV_FILE }}" > .env
            docker compose pull core admin-bff kiosk-bff
            docker compose up -d core admin-bff kiosk-bff
            echo "=== Deploy complete ==="
            docker compose ps
